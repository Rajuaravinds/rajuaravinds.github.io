<style>
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;overflow:hidden}
canvas#rain{position:fixed;inset:0;z-index:0;opacity:.45}
canvas#msgrain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.6}
.crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;max-width:980px;margin:0 auto;padding:18px}
.win{flex:1;display:flex;flex-direction:column;border:1px solid #163b28;border-radius:10px;background:rgba(8,14,18,.88);
  box-shadow:0 0 0 1px rgba(57,255,136,.05),0 0 40px rgba(57,255,136,.08);overflow:hidden;min-height:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #163b28;background:#071009}
.dot{width:11px;height:11px;border-radius:50%}
.bar .t{flex:1;text-align:center;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:6px 14px;border-bottom:1px solid #102a1c;flex-wrap:wrap}
.status b{color:var(--green);font-weight:600}
.blink{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
#out{flex:1;overflow-y:auto;padding:16px 16px 6px;line-height:1.55;min-height:0;scrollbar-width:thin;scrollbar-color:#1f8a52 transparent}
#out .line{white-space:pre-wrap;word-break:break-word}
.p{color:var(--green)} .c{color:var(--cyan)} .a{color:var(--amber)} .r{color:var(--red)} .m{color:var(--muted)} .w{color:#fff}
.glow{text-shadow:0 0 8px rgba(57,255,136,.6)}
.banner{color:var(--green);font-weight:800;line-height:1.05;white-space:pre!important;overflow:hidden;font-size:clamp(2px,calc((min(100vw,980px) - 80px) / 86.0),12px);text-shadow:0 0 10px rgba(57,255,136,.45)}
.sec{margin:6px 0 4px;color:var(--amber)}
.bar-skill{display:inline-block;color:var(--green)}
a{color:var(--cyan);text-decoration:none;border-bottom:1px dashed var(--cyan)}
a:hover{color:#fff}
.inrow{display:flex;align-items:center;gap:8px;padding:10px 16px 12px;border-top:1px solid #102a1c}
.inrow .ps{color:var(--green);white-space:nowrap}
#cmd{flex:1;background:transparent;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 14px}
.chip{background:#0b1a12;border:1px solid #1f5a3a;color:var(--green);font:inherit;font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer}
.chip:hover{background:#123222;box-shadow:0 0 10px rgba(57,255,136,.25)}
.card{border:1px solid #1d4a32;border-left:3px solid var(--green);padding:8px 12px;margin:6px 0;border-radius:4px;background:rgba(57,255,136,.03)}
.alert{border-left-color:var(--red);background:rgba(255,84,104,.05)}
.tag{display:inline-block;border:1px solid #275a40;color:var(--cyan);padding:0 6px;border-radius:3px;margin:2px 4px 2px 0;font-size:12px}
#jpop{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(2,4,6,.72);backdrop-filter:blur(4px)}
#jpop.show{display:flex;animation:jin .5s ease}
@keyframes jin{from{opacity:0}to{opacity:1}}
#jpop .box{border:1px solid var(--green);border-radius:12px;background:#071009;padding:34px 40px;text-align:center;max-width:90vw;box-shadow:0 0 60px rgba(57,255,136,.25);animation:jup .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes jup{from{transform:scale(.85)}to{transform:scale(1)}}
#jpop h2{font-size:clamp(22px,5vw,38px);color:var(--green);text-shadow:0 0 14px rgba(57,255,136,.6);font-weight:800}
#jpop p{margin-top:14px;color:var(--text);font-size:15px}
#jpop button{margin-top:22px;background:#0b1a12;border:1px solid #1f5a3a;color:var(--green);font:inherit;font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer}
.viz{white-space:normal;margin:4px 0 8px}
.vgrid{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:12px}
.vbox{border:1px solid #163b28;border-radius:6px;padding:10px 12px;background:rgba(57,255,136,.02)}
.vt{color:var(--amber);font-size:12px;margin-bottom:6px}
.radar{width:100%;max-width:320px;display:block;margin:auto}
.rd{transform-origin:140px 140px;transform:scale(0);transition:transform 1.1s cubic-bezier(.2,.9,.3,1.1)}
.on .rd{transform:scale(1)}
.sb,.tlr{display:grid;grid-template-columns:150px 1fr 30px;gap:8px;align-items:center;margin:6px 0;font-size:12px}
.tlr{grid-template-columns:150px 1fr}
.sb b{color:var(--green);font-weight:600;text-align:right}
.tr{height:8px;background:#0b1a12;border:1px solid #163b28;border-radius:4px;overflow:hidden}
.tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1f8a52,#39ff88);box-shadow:0 0 8px rgba(57,255,136,.5);transition:width 1.2s ease}
.on .tr i{width:var(--w)}
.tlt{position:relative;height:8px;background:#0b1a12;border:1px solid #163b28;border-radius:4px}
.tlt i{position:absolute;top:-1px;bottom:-1px;width:0;background:linear-gradient(90deg,#2a8fb0,#4fd8ff);border-radius:4px;box-shadow:0 0 8px rgba(79,216,255,.45);transition:width 1.3s ease .4s}
.on .tlt i{width:var(--w)}
.tly{position:relative;height:14px;font-size:10px;color:var(--muted)}
.tly em{position:absolute;transform:translateX(-50%);font-style:normal}
@media (max-width:600px){.vgrid{grid-template-columns:1fr}.sb,.tlr{grid-template-columns:128px 1fr 26px;font-size:11px;gap:6px}.tlr{grid-template-columns:128px 1fr}.sb span,.tlr span{white-space:nowrap}}
@media (max-width:600px){html,body{font-size:12.5px}.wrap{padding:8px}.status{display:none}}
</style>
</head>

/* ---------- chat relay → email (Formspree) ---------- */
// 1) Create a free form at https://formspree.io  2) paste its ID below (the part after /f/)
const FORMSPREE_ID='mkjrzkne';
let chatMode=false,chatStep=null,visitor={name:'',email:''},lastSent=0,sentCount=0;
const ps=document.querySelector('.inrow .ps');
const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const MAX_MSGS=25,COOLDOWN=4000;
function setPrompt(p,ph){ps.textContent=p;inp.placeholder=ph}
function startChat(){
  if(!FORMSPREE_ID||FORMSPREE_ID==='YOUR_FORM_ID'){line('<span class="r">chat: relay not configured yet.</span> Use <span class="c">contact</span> for now.');return}
  chatMode=true;
  line(`<div class="card"><span class="p">[ opening secure channel to Aravind ]</span>
Your messages go straight to my inbox and I'll reply by email.
Type <span class="c">exit</span> anytime to return to the shell.</div>`);
  if(visitor.name&&visitor.email){chatStep='msg';line(`<span class="p">aravind&gt;</span> Welcome back, ${esc(visitor.name)}. What's on your mind?`);setPrompt(visitor.name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'')+'@chat:~$','type your message…');return}
  chatStep='name';line('<span class="p">aravind&gt;</span> Hey! Before we start — what\'s your name?');setPrompt('name:','your name');
}
function endChat(){chatMode=false;chatStep=null;setPrompt('aravind@soc:~$',"type 'help' and press enter");line('<span class="m">[ channel closed ]</span>')}
async function relay(message){
  const r=await fetch('https://formspree.io/f/'+FORMSPREE_ID,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({name:visitor.name,email:visitor.email,_replyto:visitor.email,_subject:'[Portfolio chat] '+visitor.name,message,page:location.href,sent_at:new Date().toISOString()})});
  if(!r.ok)throw new Error('HTTP '+r.status);
}
async function chatSend(msg){
  const m=msg.trim();
  if(/^(exit|quit|bye)$/i.test(m)){line(`<span class="c">&gt;</span> ${esc(m)}`);endChat();return}
  if(chatStep==='name'){
    line(`<span class="c">name&gt;</span> <span class="w">${esc(m)}</span>`);
    if(m.length<2||m.length>60){line('<span class="r">aravind&gt; Hmm, that doesn\'t look like a name. Try again?</span>');return}
    visitor.name=m;chatStep='email';
    line(`<span class="p">aravind&gt;</span> Nice to meet you, ${esc(m)}. What's your email so I can reply?`);setPrompt('email:','you@example.com');return}
  if(chatStep==='email'){
    line(`<span class="c">email&gt;</span> <span class="w">${esc(m)}</span>`);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)||m.length>120){line('<span class="r">aravind&gt; That email doesn\'t look right — double-check it?</span>');return}
    visitor.email=m;chatStep='msg';
    line(`<span class="p">aravind&gt;</span> Got it. Go ahead — ask me anything or tell me what you're working on.`);
    setPrompt(visitor.name.split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'')+'@chat:~$','type your message…');return}
  // message step
  line(`<span class="c">you&gt;</span> <span class="w">${esc(m)}</span>`);
  if(m.length>2000){line('<span class="r">[!] message too long (2000 chars max)</span>');return}
  if(sentCount>=MAX_MSGS){line('<span class="a">[!] message limit reached for this session — email me directly via contact.</span>');return}
  const wait=COOLDOWN-(Date.now()-lastSent);
  if(wait>0){line(`<span class="a">[!] slow down a sec — try again in ${Math.ceil(wait/1000)}s :)</span>`);return}
  const d=line('<span class="m">[*] encrypting &amp; transmitting… <span class="blink">▋</span></span>');busy=true;
  try{await relay(m);lastSent=Date.now();sentCount++;
    d.innerHTML='<span class="p">[✔] delivered</span> <span class="m">— I\'ll get back to you at '+esc(visitor.email)+'</span>';
    if(sentCount===1)line('<span class="p">aravind&gt;</span> Thanks! Got your message. Feel free to keep typing, or <span class="c">exit</span> to look around.');
  }catch(e){d.innerHTML='<span class="r">[✘] transmission failed.</span> Try again, or use <span class="c">contact</span>.'}
  finally{busy=false}
}
C.chat=startChat;

/* ---------- jhals (restricted) ---------- */
const J_HASH='7e9209b2723ab4f74bae6d924c096aa23ad8990bf59bfb8ae7f96155e2e28a3b';
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
let dobMode=false,dobTries=0;
async function sha(t){return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))).map(b=>b.toString(16).padStart(2,'0')).join('')}
function parseDob(t){const m=t.trim().toLowerCase().replace(/[,.]/g,' ').replace(/\s+/g,' ').match(/^(\d{1,2})(?:st|nd|rd|th)? ([a-z]+) (\d{4})$/);if(!m)return null;
  const mi=MONTHS.findIndex(x=>x===m[2]||(m[2].length>=3&&x.startsWith(m[2])));if(mi<0)return null;
  return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')}
function jhals(){
  if(dobTries>=5){line('<span class="r">[ LOCKED ] too many failed attempts. Come back later.</span>');return}
  line(`<div class="card alert"><span class="r">[ RESTRICTED ]</span> Only J can access this one.</div><span class="a">Enter your DOB</span> <span class="m">(format: date month year, e.g. 08 June 2000)</span>`);
  dobMode=true;setPrompt('dob:','DD Month YYYY');
}
function endDob(){dobMode=false;setPrompt('aravind@soc:~$',"type 'help' and press enter")}
async function dobCheck(v){
  const t=v.trim();line(`<span class="c">dob&gt;</span> <span class="w">${esc(t.replace(/\S/g,'•'))}</span>`);
  if(/^(exit|quit)$/i.test(t)){endDob();line('<span class="m">[ aborted ]</span>');return}
  const d=parseDob(t);
  if(!d){line('<span class="a">[!] format: date month year — e.g. 08 June 2000</span>');return}
  busy=true;line('<span class="m">[*] verifying identity…</span>');await sleep(700);busy=false;
  if(await sha('jhals|'+d)===J_HASH){
    endDob();line('<span class="p">[✔] identity confirmed. access granted.</span>');
    document.getElementById('jpop').classList.add('show');
    try{fetch('https://formspree.io/f/'+FORMSPREE_ID,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({_subject:'[Portfolio] Jhals unlocked the secret :)',message:'The jhals command was unlocked with the correct DOB on your site.',page:location.href,unlocked_at:new Date().toISOString(),device:navigator.userAgent})})}catch(e){}
  }else{
    dobTries++;
    if(dobTries>=5){endDob();line('<span class="r">[✘] access denied. terminal locked for this session.</span>')}
    else line(`<span class="r">[✘] access denied.</span> <span class="m">${5-dobTries} attempt${5-dobTries>1?'s':''} left — or type exit</span>`);
  }
}
function closeJ(){document.getElementById('jpop').classList.remove('show');inp.focus()}
document.getElementById('jclose').onclick=closeJ;
document.getElementById('jpop').addEventListener('click',e=>{if(e.target.id==='jpop')closeJ()});

async function run(raw){
  const cmd=raw.trim();line(`<span class="p">aravind@soc:~$</span> <span class="w">${cmd.replace(/</g,'&lt;')}</span>`);
  if(!cmd)return;hist.push(cmd);hi=hist.length;
  const k=cmd.toLowerCase().split(/\s+/)[0];
  if(C[k]) await C[k](); else line(`<span class="r">zsh: command not found: ${k.replace(/</g,'&lt;')}</span> — try <span class="c">help</span>`);
}
inp.addEventListener('keydown',async e=>{
  if(e.key==='Enter'&&!busy){const v=inp.value;inp.value='';if(dobMode){if(v.trim())await dobCheck(v)}else if(chatMode){if(v.trim())await chatSend(v)}else await run(v)}
  else if(e.key==='ArrowUp'){if(hi>0){hi--;inp.value=hist[hi]}e.preventDefault()}
  else if(e.key==='ArrowDown'){if(hi<hist.length-1){hi++;inp.value=hist[hi]}else{hi=hist.length;inp.value=''}e.preventDefault()}
  else if(e.key==='Tab'){e.preventDefault();const m=Object.keys(C).filter(c=>c.startsWith(inp.value.toLowerCase()));if(m.length===1)inp.value=m[0];else if(m.length)line('<span class="m">'+m.join('  ')+'</span>')}
});
